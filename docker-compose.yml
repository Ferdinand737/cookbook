services:
  db:
    image: postgres:16-alpine
    container_name: cookbook-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cookbook
      POSTGRES_PASSWORD: cookbook
      POSTGRES_DB: cookbook
    ports:
      - "5432:5432"
    volumes:
      - cookbook-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cookbook"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cookbook-db:
