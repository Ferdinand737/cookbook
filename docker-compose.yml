services:
  db:
    image: postgres:16-alpine
    container_name: cookbook-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cookbook
      POSTGRES_PASSWORD: cookbook
      POSTGRES_DB: cookbook
    ports:
      - "5432:5432"
    volumes:
      - cookbook-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cookbook"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cookbook-web
    restart: unless-stopped
    ports:
      - "3006:3000"
    environment:
      DATABASE_URL: postgresql://cookbook:cookbook@db:5432/cookbook
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://192.168.1.70:3006}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?Set OPENROUTER_API_KEY in .env}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-z-ai/glm-5.3-flash}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-http://ai.netbird.selfhosted:4000/v1}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

volumes:
  cookbook-db:
